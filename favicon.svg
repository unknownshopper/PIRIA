<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .stop1 { stop-color: #5b8cff; animation: c1 2.2s infinite; }
      .stop2 { stop-color: #8b5cf6; animation: c2 2.2s infinite; }
      @keyframes c1 { 0%,100%{ stop-color:#5b8cff } 33%{ stop-color:#00e5ff } 66%{ stop-color:#ff2d95 } }
      @keyframes c2 { 0%,100%{ stop-color:#8b5cf6 } 33%{ stop-color:#ff2d95 } 66%{ stop-color:#00e5ff } }
      .glow { animation: pulse 1.6s infinite; }
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:.9 } }
      .shine { animation: spin 2s linear infinite; transform-origin: 32px 32px; }
      @keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    </style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" class="stop1" />
      <stop offset="100%" class="stop2" />
    </linearGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
    <clipPath id="dotClip">
      <circle cx="32" cy="32" r="18" />
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#04060e" />
  <circle cx="32" cy="32" r="18" fill="url(#g)" />
  <circle class="glow" cx="32" cy="32" r="18" fill="url(#g)" filter="url(#gl)" opacity=".45" />
  <g clip-path="url(#dotClip)">
    <circle class="shine" cx="32" cy="20" r="4" fill="white" opacity=".95" />
  </g>
</svg>
